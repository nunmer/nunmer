<desc id="d">2018: first commit, joined GitHub. 2021: Trust-Mail, school platform, graded A*. 2022: web3 + java, dapps, NFTs, load testing. 2023: BaigeCode, frontends and classifiers. 2024: gpstracker, IoT and e-commerce. 2025: fintech AI, LLM orchestration, voice. 2026: OnSteppe, agents, games, maps</desc>
