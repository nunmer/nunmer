<style>.led { animation: led 2s ease-in-out infinite; } @keyframes led { 50% { opacity: .3; } }
.rn-line { stroke-dasharray: 400; stroke-dashoffset: 400; animation: rn-draw 5s ease-in-out infinite; }
@keyframes rn-draw { 0% { stroke-dashoffset: 400; } 70%,100% { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
