<title id="t">Tanba (public)</title>
<desc id="d">Permanent NFC/QR identifiers with cloud routing. Repoint thousands of physical tags instantly.</desc>
<style>.led { animation: led 2s ease-in-out infinite; } @keyframes led { 50% { opacity: .3; } }
.nf-w { fill: none; stroke: #3FE0D0; transform-box: fill-box; transform-origin: center; animation: nf-w 2.4s ease-out infinite; opacity: 0; }
@keyframes nf-w { from { transform: scale(.4); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
.nf-d { opacity: .25; animation: nf-d 6s steps(1) infinite; }
@keyframes nf-d { 0%,33% { opacity: 1; } 34%,100% { opacity: .25; } }
.nf-a { animation: nf-a 6s steps(1) infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
