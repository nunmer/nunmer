name: refresh profile art

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/profile.json'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Render from live data and commit (rebuilt on latest main on retry)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "steppe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            node scripts/generate.mjs
            git add assets data/snapshot.json
            if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
            git commit -m "chore: refresh the night sky"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 4 + RANDOM % 5))
          done
          exit 1
